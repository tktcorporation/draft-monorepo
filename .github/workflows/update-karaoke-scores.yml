name: Update Karaoke Scores

on:
  # 毎週日曜日の午前9時（JST 18時）に実行
  schedule:
    - cron: '0 9 * * 0'
  # 手動実行も可能
  workflow_dispatch:

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright and dependencies
        run: npm run install-playwright -w @draft/karaoke-scraper

      - name: Run karaoke scraper
        env:
          CLUB_DAM_ID: ${{ secrets.CLUB_DAM_ID }}
          CLUB_DAM_PASS: ${{ secrets.CLUB_DAM_PASS }}
        run: npm run scrape -w @draft/karaoke-scraper

      - name: Format code with Biome
        run: npm run format

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat: update karaoke scores'
          branch: automated/update-karaoke-scores
          delete-branch: true
          title: '🎤 Update karaoke scores'
          body: |
            ## 📊 カラオケスコア更新

            週次自動更新により、DAM TOMOから最新の精密採点データを取得しました。

            ### 更新内容
            - 新規スコアを追加
            - スコアを点数順にソート
            - Biomeでコードフォーマットを実行

            ### 確認事項
            - [ ] scores.jsonが正しく更新されている
            - [ ] public/scores.jsonも更新されている
            - [ ] 統計情報が妥当である

            🤖 This PR was automatically generated by GitHub Actions
          labels: |
            automated
            karaoke
          assignees: ${{ github.repository_owner }}
